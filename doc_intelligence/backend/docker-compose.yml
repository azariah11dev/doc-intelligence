services:
  postgres:
    image: postgres:16
    container_name: DocIntelligenceDB_Postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: DocIntelligenceDB
    ports:
      - "5432:5432"
    volumes:
      - DocIntelligenceDB_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: DocIntelligence_App
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /app/src
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: uv run uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  DocIntelligenceDB_pgdata:
